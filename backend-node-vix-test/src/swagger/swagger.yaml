openapi: 3.0.3
info:
  title: API CLOUD
  version: 1.0.0
  contact: {}
servers:
  - url: "{{url}}"
paths:
  /api/v1/auth/register:
    post:
      tags:
        - auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - email
              properties:
                username:
                  type: string
                  example: "john_doe"
                password:
                  type: string
                  format: password
                  example: "SecurePassword123!"
                email:
                  type: string
                  format: email
                  example: "john@example.com"
                profileImgUrl:
                  type: string
                  nullable: true
                  example: "https://example.com/image.jpg"
                role:
                  type: string
                  enum: [admin, member, manager]
                  example: "member"
                idBrandMaster:
                  type: number
                  example: 1
                isActive:
                  type: boolean
                  example: false
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
                  username:
                    type: string
                  email:
                    type: string
                  token:
                    type: string
        "400":
          description: Validation error
        "409":
          description: User already exists

  /api/v1/auth/login:
    post:
      tags:
        - auth
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "john@example.com"
                password:
                  type: string
                  format: password
                  example: "SecurePassword123!"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      idUser:
                        type: number
                      username:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
        "401":
          description: Invalid credentials
        "400":
          description: Validation error

  /api/v1/users:
    get:
      tags:
        - user
      summary: List all users with filters
      security:
        - bearerAuth: []
      parameters:
        - name: idBrandMaster
          in: query
          required: true
          schema:
            type: number
          example: 1
        - name: idUser
          in: query
          required: false
          schema:
            type: number
          example: 5
        - name: username
          in: query
          required: false
          schema:
            type: string
          example: "john"
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
          example: "john@example.com"
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [admin, member, manager]
          example: "admin"
        - name: isActive
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
          example: "true"
        - name: page
          in: query
          required: false
          schema:
            type: number
            default: 1
          example: 1
        - name: limit
          in: query
          required: false
          schema:
            type: number
            default: 10
            maximum: 100
          example: 10
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
          example: "username"
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
          example: "asc"
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCount:
                    type: number
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        idUser:
                          type: number
                        username:
                          type: string
                        email:
                          type: string
                        role:
                          type: string
                        isActive:
                          type: boolean
                        lastLoginDate:
                          type: string
                          format: date-time
        "400":
          description: Validation error
        "401":
          description: Unauthorized

    post:
      tags:
        - user
      summary: Create a new user (Manager or Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - email
                - idBrandMaster
              properties:
                username:
                  type: string
                  example: "jane_doe"
                password:
                  type: string
                  format: password
                  example: "SecurePassword123!"
                email:
                  type: string
                  format: email
                  example: "jane@example.com"
                profileImgUrl:
                  type: string
                  nullable: true
                  example: "https://example.com/image.jpg"
                role:
                  type: string
                  enum: [admin, member, manager]
                  example: "member"
                idBrandMaster:
                  type: number
                  example: 1
                isActive:
                  type: boolean
                  example: true
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  idUser:
                    type: number
                  username:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Manager or Admin access required
        "409":
          description: User already exists

  /api/v1/users/{idUser}:
    get:
      tags:
        - user
      summary: Get user by ID
      security:
        - bearerAuth: []
      parameters:
        - name: idUser
          in: path
          required: true
          schema:
            type: number
          example: 5
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  idUser:
                    type: number
                  username:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                  isActive:
                    type: boolean
                  lastLoginDate:
                    type: string
                    format: date-time
        "400":
          description: Invalid user ID
        "401":
          description: Unauthorized
        "404":
          description: User not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
  - name: auth
    description: Authentication endpoints
  - name: user
    description: User management endpoints
  - name: brandMaster
  - name: VM
